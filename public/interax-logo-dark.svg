<svg width="480" height="160" viewBox="0 0 480 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark mode gradient: lavender → violet → bright purple -->
    <linearGradient id="brand-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E6E6FA"/>
      <stop offset="50%"  stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9370DB"/>
    </linearGradient>

    <!-- Subtle purple glow for dark mode -->
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.7 0 0.9 0 0   0 0 0.9 0 0   0.9 0.5 1 0 0   0 0 0 0.6 0"
        result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- App icon clip -->
    <clipPath id="icon-clip-dark">
      <rect x="0" y="10" width="140" height="140" rx="29"/>
    </clipPath>
  </defs>

  <!-- ════════════════════════════════════════
       APP ICON MARK (rounded square badge)
  ════════════════════════════════════════ -->
  <!-- Background square — dark card feel -->
  <rect x="0" y="10" width="140" height="140" rx="29" fill="#1A0A2E"/>
  <!-- Subtle inner border -->
  <rect x="0" y="10" width="140" height="140" rx="29" fill="none" stroke="#C084FC" stroke-width="1.5" opacity="0.25"/>

  <!-- iX letterform — gradient on dark bg -->
  <g clip-path="url(#icon-clip-dark)" transform="translate(0,10)">
    <g transform="translate(70,70) scale(0.76) translate(-90,-89)">
      <!-- N-shape / i glyph -->
      <path
        d="M52.141 30H87.632C102.023 30 113.689 41.666 113.689 56.057V89.904H99.112V56.057C99.112 55.71 99.098 55.366 99.072 55.025L63.581 89.898C63.701 89.902 63.821 89.904 63.941 89.904H99.112V103.672H63.941C49.55 103.672 37.564 91.891 37.564 77.5V43.743H52.141V77.5C52.141 78.15 52.191 78.792 52.289 79.422L88.56 43.782C88.255 43.756 87.945 43.743 87.632 43.743H52.141V30Z"
        fill="url(#brand-grad-dark)"
      />
      <!-- Y-flag / tail glyph -->
      <path
        d="M16.293 101.136L-35 43.737H-14.365L15.749 77.436V43.737H31.137V95.47C31.137 103.278 21.495 106.958 16.293 101.136Z"
        fill="url(#brand-grad-dark)"
      />
    </g>
  </g>

  <!-- ════════════════════════════════════════
       STANDALONE CIRCULAR X MARK
  ════════════════════════════════════════ -->
  <!-- Circular arc -->
  <circle
    cx="192" cy="80" r="52"
    fill="none"
    stroke="url(#brand-grad-dark)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-dasharray="304 22"
    stroke-dashoffset="0"
    transform="rotate(238 192 80)"
    filter="url(#glow-dark)"
  />
  <!-- Dot -->
  <circle cx="156" cy="42" r="3.6" fill="url(#brand-grad-dark)"/>
  <!-- X cross lines -->
  <line x1="167" y1="50" x2="218" y2="110" stroke="url(#brand-grad-dark)" stroke-width="8.8" stroke-linecap="round" filter="url(#glow-dark)"/>
  <line x1="218" y1="50" x2="167" y2="110" stroke="url(#brand-grad-dark)" stroke-width="8.8" stroke-linecap="round" filter="url(#glow-dark)"/>

  <!-- ════════════════════════════════════════
       WORDMARK
  ════════════════════════════════════════ -->
  <text
    x="260" y="95"
    font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
    font-size="58"
    font-weight="800"
    letter-spacing="-2"
    fill="url(#brand-grad-dark)"
  >InteraX</text>

  <!-- Tagline -->
  <text
    x="263" y="120"
    font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="3.5"
    fill="#C084FC"
    opacity="0.6"
  >CONNECT · SHARE · GROW</text>
</svg>
